name: Refresh tracker health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: tracker-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and validate lists
        run: python3 scripts/build.py --timeout 5 --workers 48
      - name: Run tests
        run: python3 -m unittest discover -s tests
      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data lists; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data lists
          git commit -m "chore: refresh tracker health"
          git push
